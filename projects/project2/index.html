<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Project</title>
	<style>
		html, body { margin: 0; padding: 0; overflow: hidden; }
		canvas { display: block; }

		/* Segment-Schalter für 0% / 50% / 90% (gross, weil er die wichtigste Entscheidung ist) */
		.segmented {
			padding: 4px;
			background: #E9ECEF;
			border-radius: 999px;
			font-family: sans-serif;
			line-height: 0;
			white-space: nowrap;
		}
		.segmented label {
			cursor: pointer;
		}
		.segmented input {
			position: absolute;
			opacity: 0;
			pointer-events: none;
		}
		.segmented span {
			display: inline-block;
			padding: 8px 24px;
			border-radius: 999px;
			font-size: 20px;
			font-weight: bold;
			line-height: 1.3;
			color: #4F5B66;
			transition: background 0.2s, color 0.2s;
		}
		.segmented label:hover span {
			background: rgba(79, 91, 102, 0.12);
		}
		.segmented input:checked + span {
			background: #4F5B66;
			color: white;
		}
	</style>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.5/p5.min.js"></script>
</head>
<body>
	<script src="script.js"></script>
</body>
</html>
